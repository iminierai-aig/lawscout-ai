name: Publish production images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag for Dokploy (for example v2.1.3)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/iminierai-aig/lawscout-ai-backend
  FRONTEND_IMAGE: ghcr.io/iminierai-aig/lawscout-ai-frontend
  FRONTEND_API_URL: https://api.lawscoutai.com

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
    steps:
      - id: release
        name: Validate release tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
              echo "Manual production releases must run from master." >&2
              exit 1
            fi
            IMAGE_TAG="${REQUESTED_TAG}"
          else
            IMAGE_TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${IMAGE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Image tag must look like v2.1.3 (received: ${IMAGE_TAG})" >&2
            exit 1
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          for image in "${BACKEND_IMAGE}" "${FRONTEND_IMAGE}"; do
            if docker buildx imagetools inspect "${image}:${IMAGE_TAG}" >/dev/null 2>&1; then
              echo "Image ${image}:${IMAGE_TAG} already exists; choose a new version." >&2
              exit 1
            fi
          done

  verify-backend:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_KEY: release-only-secret-that-is-long-enough-for-jwt-signing
      DATABASE_URL: "sqlite:///:memory:"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install regression-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.109.0 httpx==0.26.0 pydantic==2.5.3 \
            sqlalchemy==2.0.23 'python-jose[cryptography]==3.3.0' \
            'passlib[bcrypt]==1.7.4' slowapi==0.1.9 pytest==8.3.4 \
            python-multipart==0.0.6 email-validator==2.2.0 itsdangerous==2.1.2
      - run: pytest -q tests

  backend:
    needs: [prepare, verify-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ needs.prepare.outputs.image_tag }}
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: true
          sbom: true

  frontend:
    needs: [prepare, verify-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.FRONTEND_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ needs.prepare.outputs.image_tag }}
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: true
          sbom: true
