name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_KEY: ci-only-secret-that-is-long-enough-for-jwt-signing
      DATABASE_URL: "sqlite:///:memory:"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.109.0 httpx==0.26.0 pydantic==2.5.3 \
            sqlalchemy==2.0.23 'python-jose[cryptography]==3.3.0' \
            'passlib[bcrypt]==1.7.4' slowapi==0.1.9 pytest==8.3.4 \
            python-multipart==0.0.6 email-validator==2.2.0 itsdangerous==2.1.2
      - name: Compile backend
        run: python -m compileall -q api auth main.py limiter.py
      - name: Run backend regression tests
        run: pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
